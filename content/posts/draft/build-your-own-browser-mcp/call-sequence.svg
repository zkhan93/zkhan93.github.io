<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t4 d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t4">Sequence of a single read_url call</title>
  <desc id="d4">The agent calls read_url. The broker sends an open_tab request tagged with a uuid over the WebSocket, the extension creates the tab and replies with the same id, the broker resolves the parked future, then repeats for get_html, converts the rendered HTML to Markdown server-side, and returns it.</desc>

  <defs>
    <marker id="cSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="cOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" rx="10" fill="#12161d"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#e6e9ef">One <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5">read_url</tspan> call, end to end</text>

  <!-- lifeline headers -->
  <rect x="36"  y="48" width="120" height="42" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="96"  y="74" text-anchor="middle" font-size="12.5" fill="#e6e9ef">Agent</text>

  <rect x="255" y="48" width="170" height="42" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="340" y="68" text-anchor="middle" font-size="12.5" fill="#e6e9ef">broker</text>
  <text x="340" y="83" text-anchor="middle" font-size="11" fill="#8b95a5">MCP tool + bridge</text>

  <rect x="517" y="48" width="150" height="42" rx="6" fill="#16241c" stroke="#2f6b45"/>
  <text x="592" y="74" text-anchor="middle" font-size="12.5" fill="#e6e9ef">MV3 extension</text>

  <rect x="758" y="48" width="120" height="42" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="818" y="74" text-anchor="middle" font-size="12.5" fill="#e6e9ef">the page</text>

  <!-- lifelines -->
  <g stroke="#2c3441" stroke-dasharray="4 5">
    <line x1="96"  y1="96" x2="96"  y2="444"/>
    <line x1="340" y1="96" x2="340" y2="444"/>
    <line x1="592" y1="96" x2="592" y2="444"/>
    <line x1="818" y1="96" x2="818" y2="444"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">

    <!-- 1 -->
    <line x1="96" y1="126" x2="335" y2="126" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#cSolid)"/>
    <text x="218" y="119" fill="#9dc4f0">read_url("https://&#8230;")</text>

    <!-- 2 -->
    <line x1="340" y1="156" x2="587" y2="156" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#cSolid)"/>
    <text x="464" y="149" fill="#9dc4f0">{"id":"7f3a","method":"open_tab"}</text>

    <!-- 3 -->
    <line x1="592" y1="186" x2="813" y2="186" stroke="#4ade80" stroke-width="1.5" marker-end="url(#cSolid)"/>
    <text x="704" y="179" fill="#8fd8a8">chrome.tabs.create</text>

    <!-- 4 -->
    <line x1="813" y1="216" x2="597" y2="216" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cOpen)"/>
    <text x="704" y="209" fill="#9aa4b2">status: complete</text>

    <!-- 5 -->
    <line x1="587" y1="246" x2="345" y2="246" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cOpen)"/>
    <text x="466" y="239" fill="#9aa4b2">{"id":"7f3a","ok":true,&#8230;}</text>

    <!-- 6: self note -->
    <text x="350" y="273" text-anchor="start" fill="#d9b45c" font-size="11">future 7f3a resolved by id</text>

    <!-- 7 -->
    <line x1="340" y1="300" x2="587" y2="300" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#cSolid)"/>
    <text x="464" y="293" fill="#9dc4f0">{"id":"b19c","method":"get_html"}</text>

    <!-- 8 -->
    <line x1="592" y1="330" x2="813" y2="330" stroke="#4ade80" stroke-width="1.5" marker-end="url(#cSolid)"/>
    <text x="704" y="323" fill="#8fd8a8">executeScript</text>

    <!-- 9 -->
    <line x1="813" y1="360" x2="597" y2="360" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cOpen)"/>
    <text x="704" y="353" fill="#9aa4b2">outerHTML</text>

    <!-- 10 -->
    <line x1="587" y1="390" x2="345" y2="390" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cOpen)"/>
    <text x="466" y="383" fill="#9aa4b2">{"id":"b19c","ok":true,&#8230;}</text>

    <!-- 11: self note -->
    <text x="350" y="417" text-anchor="start" fill="#d9b45c" font-size="11">html_to_markdown() &#8212; server-side</text>

    <!-- 12 -->
    <line x1="335" y1="440" x2="101" y2="440" stroke="#7b8794" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cOpen)"/>
    <text x="218" y="433" fill="#9aa4b2">markdown</text>
  </g>

  <text x="813" y="374" text-anchor="end" font-size="11" fill="#6b7480" font-style="italic">fully rendered &#8212; post-JS, post-login</text>

  <text x="24" y="470" font-size="11.5" fill="#8b95a5">Every request carries a uuid. The bridge parks an <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#c3cad4">asyncio.Future</tspan> against it and resolves it when the frame with the matching id comes back.</text>
</svg>
