<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t3 d3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t3">Relay topology</title>
  <desc id="d3">An agent connects over MCP to a headless broker. The broker exposes an /mcp endpoint and a /bridge WebSocket, plus a registry of connected browsers. The Chrome extension on the user's machine opens the WebSocket outward into the broker, crossing NAT, so no inbound port is needed.</desc>

  <defs>
    <marker id="bBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/>
    </marker>
    <marker id="bGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="bMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="10" fill="#12161d"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#e6e9ef">The broker never runs a browser</text>

  <!-- agent -->
  <rect x="24" y="150" width="132" height="72" rx="7" fill="#1c2230" stroke="#3a4453"/>
  <text x="90" y="180" text-anchor="middle" font-size="13.5" fill="#e6e9ef">Agent</text>
  <text x="90" y="199" text-anchor="middle" font-size="10.5" fill="#8b95a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Claude, Cursor, &#8230;</text>

  <!-- broker container -->
  <rect x="212" y="80" width="318" height="228" rx="9" fill="#151a23" stroke="#39424f" stroke-dasharray="5 4"/>
  <text x="228" y="104" font-size="11" fill="#7b8794" letter-spacing="0.04em">YOUR SERVER &#8212; headless, always on</text>

  <rect x="232" y="120" width="132" height="58" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="298" y="143" text-anchor="middle" font-size="12.5" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/mcp</text>
  <text x="298" y="162" text-anchor="middle" font-size="11" fill="#8b95a5">streamable HTTP</text>

  <rect x="380" y="120" width="132" height="58" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="446" y="143" text-anchor="middle" font-size="12.5" fill="#e6e9ef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/bridge</text>
  <text x="446" y="162" text-anchor="middle" font-size="11" fill="#8b95a5">WebSocket</text>

  <rect x="232" y="214" width="280" height="72" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="372" y="240" text-anchor="middle" font-size="12.5" fill="#e6e9ef">bridge registry</text>
  <text x="372" y="259" text-anchor="middle" font-size="11" fill="#8b95a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{client_id: ws}</text>
  <text x="372" y="275" text-anchor="middle" font-size="11" fill="#8b95a5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+ pending futures by id</text>

  <g stroke="#7b8794" stroke-width="1.3" marker-end="url(#bMuted)" marker-start="url(#bMuted)">
    <line x1="298" y1="183" x2="298" y2="209"/>
    <line x1="446" y1="183" x2="446" y2="209"/>
  </g>

  <!-- agent <-> /mcp -->
  <line x1="161" y1="186" x2="227" y2="186" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#bBlue)" marker-start="url(#bBlue)"/>
  <text x="194" y="176" text-anchor="middle" font-size="11" fill="#8fbcf0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MCP</text>

  <!-- NAT wall -->
  <line x1="571" y1="92" x2="571" y2="322" stroke="#7f6a2d" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="571" y="342" text-anchor="middle" font-size="11" fill="#c9a94a">NAT / firewall</text>
  <text x="571" y="358" text-anchor="middle" font-size="11" fill="#7b8794">no inbound port, no forwarding</text>

  <!-- chrome container -->
  <rect x="612" y="80" width="264" height="228" rx="9" fill="#151a23" stroke="#39424f" stroke-dasharray="5 4"/>
  <text x="628" y="104" font-size="11" fill="#7b8794" letter-spacing="0.04em">YOUR MACHINE &#8212; real Chrome</text>

  <rect x="630" y="120" width="228" height="58" rx="6" fill="#16241c" stroke="#2f6b45"/>
  <text x="744" y="143" text-anchor="middle" font-size="12.5" fill="#e6e9ef">MV3 extension</text>
  <text x="744" y="162" text-anchor="middle" font-size="11" fill="#7fcfa0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WS client + keepalive</text>

  <rect x="630" y="192" width="228" height="46" rx="6" fill="#1c2230" stroke="#4a5568"/>
  <text x="744" y="212" text-anchor="middle" font-size="10.5" fill="#c3cad4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chrome.tabs</text>
  <text x="744" y="228" text-anchor="middle" font-size="10.5" fill="#c3cad4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chrome.scripting</text>

  <text x="744" y="262" text-anchor="middle" font-size="10.5" fill="#8b95a5">your profile, cookies, live sessions</text>
  <text x="744" y="280" text-anchor="middle" font-size="10.5" fill="#8fd8a8">your residential IP</text>

  <g stroke="#7b8794" stroke-width="1.3" marker-end="url(#bMuted)">
    <line x1="744" y1="182" x2="744" y2="188"/>
  </g>

  <!-- the outbound websocket: arrow points INTO the broker -->
  <line x1="626" y1="149" x2="517" y2="149" stroke="#4ade80" stroke-width="1.8" marker-end="url(#bGreen)"/>
  <rect x="528" y="120" width="86" height="16" fill="#12161d"/>
  <text x="571" y="132" text-anchor="middle" font-size="10.5" fill="#8fd8a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">outbound WS</text>

  <text x="24" y="392" font-size="12" fill="#8b95a5">The extension dials <tspan fill="#8fd8a8">out</tspan>, so the browser can sit behind NAT on any network &#8212; hotel wifi, tethered phone, home LAN &#8212; and the server still reaches it.</text>
</svg>
